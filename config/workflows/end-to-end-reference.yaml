schema_version: 2

# Terminology model: see docs/decisions/0003-autodesk-platform-product-and-api-terminology.md
# and docs/guides/GLOSSARY.md. Confirmed component capability inventory:
# see docs/architecture/COMPONENT_BOUNDARIES.md (inventory verified 2026-07-27).
#
# Schema v2 governance model (docs/decisions/0008-govern-implementation-state-per-capability.md
# and docs/decisions/0009-define-capability-record-cardinality-for-schema-v2.md):
# a STAGE is the BIM workflow / teaching category; a CAPABILITY inside it is the
# unit of implementation governance. Capabilities within one stage may differ
# independently on every axis below, and those axes must never be conflated or
# collapsed into a single capability status.
#
# STAGE-LEVEL fields:
#
#   id                        Stage identifier (BIM lifecycle ordering below).
#   platform                  Autodesk platform the stage lives on (branding tier).
#   automation_policy         This project's chosen automation posture.
#   capabilities              The governed capabilities in this stage. An empty
#                             list ([]) means NO governed capability is
#                             represented — not merely that no MCP tool exists,
#                             no API family is asserted, or no data is ready.
#
# CAPABILITY-LEVEL fields — REQUIRED:
#
#   id                        Stable machine-oriented capability identity, scoped
#                             within the stage. Human-readable Autodesk API-family
#                             terminology is a value, never the record key.
#   primary_system            The product/system surface associated with the
#                             governed capability.
#   api_maturity              Separately verified lifecycle classification of the
#                             underlying Autodesk developer API:
#                             beta | ga | to-be-verified | not-applicable.
#                             ga = General Availability. A concrete lifecycle
#                             classification is asserted only where verified
#                             against an official Autodesk/APS source and cited
#                             in the documentation; otherwise use to-be-verified,
#                             which is this repository's epistemic sentinel and is
#                             NOT an Autodesk lifecycle state. not-applicable means
#                             the capability/API is identified but this lifecycle
#                             vocabulary does not apply to that API context.
#   mcp_component             Owning integration component: aps-forma-mcp |
#                             revit-mcp | none. Asserts ownership, not
#                             implementation.
#   mcp_implementation_status Whether THIS project's MCP tooling exists for the
#                             capability: confirmed | partial | planned |
#                             not-applicable. `partial` describes THAT
#                             capability's own tool surface, never several
#                             capabilities aggregated together.
#   data_readiness            Whether the approved example or training project for
#                             this capability holds enough data to demonstrate it:
#                             ready | blocked | not-assessed. The Harrismith
#                             example is the default; where a capability was
#                             verified in a different approved project, name that
#                             scope in data_readiness_reason. Never derived from
#                             implementation status.
#                             READINESS LIFETIME DIFFERS BY SYSTEM, VOCABULARY DOES
#                             NOT. Cloud readiness is normally project/data scoped
#                             and durable: an Autodesk project either holds the
#                             fixture or it does not. Local Revit readiness is
#                             normally session/document scoped: it holds only while
#                             the expected model is open in a running Revit with the
#                             pyRevit Routes bridge available. The same three values
#                             express both; name the scope in data_readiness_reason.
#                             No prerequisite field exists or is required — session
#                             preconditions are verification-time facts recorded in
#                             evidence, not capability-record fields.
#
# CAPABILITY-LEVEL fields — CONDITIONAL:
#
#   api_family                The developer API family. Present when asserted from
#                             component source/documentation or official
#                             Autodesk/APS documentation. ABSENT means UNASSERTED
#                             (deliberately not yet named, per ADR-0003) — never
#                             "no API exists". Not a maturity claim.
#   api_version               The API contract / request-route version of the
#                             governed API surface — NOT the documentation-set
#                             version. REQUIRED whenever api_maturity is a concrete
#                             lifecycle assertion (beta or ga), because a lifecycle
#                             claim binds to a version. May be omitted for
#                             to-be-verified and not-applicable. There is no closed
#                             value set: versions are API-specific. `to-be-verified`
#                             is never used as an api_version value; an unknown
#                             version is represented by omission.
#
# CAPABILITY-LEVEL fields — OPTIONAL:
#
#   data_readiness_reason     Optional sanitised machine-readable explanation of
#                             data_readiness. Never invented where none exists.
#
# Live-verification, public-evidence and gate status remain SEPARATE governance
# axes and are deliberately not machine-readable fields here; they are governed by
# the evidence and gate documents (ADR-0008).
#
# Terminology last verified: 2026-07-22

workflow:
  id: autodesk-bim-end-to-end-reference
  name: Autodesk BIM End-to-End Reference Workflow
  implementation_style: hybrid

stages:
  - id: site_and_context
    platform: Autodesk Forma
    automation_policy: experimental_and_read_first
    capabilities:
      - id: site_context
        primary_system: Forma Site Design
        # api_version/api_maturity are the verified decomposition of the retired
        # schema-v1 compound maturity value. Both facts are independently
        # established and cited in docs/guides/GLOSSARY.md: the route version is
        # v1alpha and the Autodesk lifecycle classification is Beta.
        api_family: Forma Site Design API
        api_version: v1alpha
        api_maturity: beta
        mcp_component: aps-forma-mcp
        mcp_implementation_status: confirmed
        data_readiness: ready

  - id: concept_design
    platform: Autodesk Forma
    automation_policy: limited_guarded_automation
    capabilities:
      - id: concept_proposals
        primary_system: Forma
        # MCP proposal read + one guarded proposal-create tool exist (Beta). This does
        # NOT mean all concept-design operations are automated, hence status: partial.
        # Same verified decomposition of the retired compound maturity value as
        # site_context above.
        api_family: Forma Site Design API
        api_version: v1alpha
        api_maturity: beta
        mcp_component: aps-forma-mcp
        mcp_implementation_status: partial
        data_readiness: ready

  - id: revit_authoring
    platform: Autodesk Revit
    automation_policy: pyrevit_mcp
    # STAGE SCOPE. Five governed capabilities, separated 2026-07-29 from a single
    # earlier `revit_authoring` capability record that aggregated read-only document
    # interrogation, model authoring and unbounded code execution under one
    # implementation status and one readiness value. That aggregation could not
    # express a capability that is data-ready alongside capabilities that are not,
    # nor separate a read surface from a write surface — the stage-versus-capability
    # conflation ADR-0008 exists to prevent, recurring inside one record. The split
    # asserts NO new implementation: every tool named below already existed at the
    # inspected Revit MCP revision ae01d29 (COMPONENT_BOUNDARIES.md 4).
    #
    # ALL FIVE share the same system, API and MCP metadata:
    #   primary_system: Revit · api_family: Autodesk Revit API · api_version OMITTED
    #   api_maturity: not-applicable · mcp_component: revit-mcp
    # api_version is deliberately OMITTED for every one: no API contract/request-route
    # version fact is established in this repository. Revit release years and pyRevit
    # product versions are PRODUCT versions, which ADR-0009 4 excludes, and no
    # version is invented to fill the field.
    # api_maturity: not-applicable for every one: `beta` and `ga` are Autodesk
    # lifecycle classifications, and neither the Revit desktop API nor the
    # third-party pyRevit Routes bridge carries one (ADR-0008).
    # API FAMILY: `Autodesk Revit API` is retained for all five because the BIM
    # operation ultimately executes against the Revit document/DB API. The pyRevit
    # Routes HTTP bridge is an INTEGRATION TRANSPORT between the MCP process and the
    # Revit process, not the capability's Autodesk BIM API family; it is documented
    # at the component boundary instead (COMPONENT_BOUNDARIES.md 4.1) and is
    # deliberately never written into api_family.
    # READ/WRITE: classified by observable local state semantics under ADR-0015, not
    # by transport verb. No revit-mcp write tool is guarded by the component; see
    # COMPONENT_BOUNDARIES.md 4.2.
    capabilities:
      - id: revit_model_inspection
        primary_system: Revit
        # Read-only document interrogation: get_revit_model_info, list_levels,
        # list_families, list_family_categories, list_category_parameters. No Revit
        # transaction is opened by any of them, so none can mutate the document
        # (ADR-0015). list_category_parameters is a read despite POST transport.
        api_family: Autodesk Revit API
        api_maturity: not-applicable
        mcp_component: revit-mcp
        mcp_implementation_status: confirmed
        # SCOPE OF data_readiness BELOW: model-inspection data was first demonstrated
        # in the published Phase 1 live Revit session (2026-07-22), which returned the
        # model title and its levels from the Harrismith model and is recorded in
        # revit-to-cde-trace.result.json. That session exercised model and level reads
        # only. The Revit Alignment live read verification (2026-07-29,
        # COMPONENT_BOUNDARIES.md 4.4) subsequently exercised the remainder of this
        # group against the active HFS-ARC document: model inspection, level
        # inspection, family categories, families and category parameters. The
        # readiness value is unchanged and remains scoped to that model in that
        # session — it asserts nothing about other Revit models, other documents,
        # other view or category contexts, any write capability, or production
        # readiness.
        data_readiness: ready
        data_readiness_reason: revit-model-inspection-demonstrated-in-phase-1-live-session

      - id: revit_view_inspection_export
        primary_system: Revit
        # View interrogation and export: list_revit_views, get_current_view_info,
        # get_current_view_elements, get_revit_view. Read under ADR-0015:
        # get_revit_view writes a temporary PNG outside the document and removes it,
        # which is a bounded transient external side effect, not a document write.
        # The Phase 1 session recorded an empty view list, so this group was
        # not-assessed until the Revit Alignment live read verification.
        api_family: Autodesk Revit API
        api_maturity: not-applicable
        mcp_component: revit-mcp
        mcp_implementation_status: confirmed
        # SCOPE OF data_readiness BELOW: readiness was established by the Revit
        # Alignment live read verification (2026-07-29, COMPONENT_BOUNDARIES.md 4.4)
        # against the active HFS-ARC document, through the governed read tools only.
        # It is scoped to THAT model in THAT session and asserts nothing about other
        # Revit models, every possible view name, any write capability, component
        # hardening, or production readiness. One export was observed to fail on a
        # view name containing braces and to succeed on a brace-free exportable view
        # (COMPONENT_BOUNDARIES.md 4.4), so view-name handling is not universal.
        data_readiness: ready
        data_readiness_reason: revit-view-inspection-export-demonstrated-in-hfs-arc-live-read-session

      - id: revit_element_authoring
        primary_system: Revit
        # Model authoring: place_family. Creates a family instance inside a committed
        # Revit transaction, with rollback on failure — a document WRITE under
        # ADR-0015. It has never been exercised in any governed run, and no write
        # to any Revit model is authorised by this record.
        api_family: Autodesk Revit API
        api_maturity: not-applicable
        mcp_component: revit-mcp
        mcp_implementation_status: confirmed
        data_readiness: not-assessed

      - id: revit_view_graphic_overrides
        primary_system: Revit
        # Presentation state: color_splash, clear_colors. Both commit a Revit
        # transaction that sets element graphic overrides on views, so both are
        # document WRITES under ADR-0015 — the mutation is PERSISTENT VIEW STATE
        # rather than model geometry, and it survives as saved, undoable document
        # state that another caller can observe. It is not a temporary display
        # effect. This distinction is carried in prose because the read/write class
        # already governs it; no schema field is added for it.
        # Observed scope note: the implementation also applies overrides to other
        # views of the same view type, so the effect is not confined to the active
        # view. Never exercised in any governed run.
        api_family: Autodesk Revit API
        api_maturity: not-applicable
        mcp_component: revit-mcp
        mcp_implementation_status: confirmed
        data_readiness: not-assessed

      - id: revit_code_execution
        primary_system: Revit
        # Arbitrary local code execution: execute_revit_code. Accepts caller-supplied
        # IronPython and executes it inside Revit with the document, the Revit DB
        # namespace and the pyRevit module in scope, wrapped in one transaction that
        # is committed on success. It is therefore UNBOUNDED: its reach is whatever
        # the Revit API permits, it is classified WRITE under ADR-0015 regardless of
        # any stated intent, and it is NOT a normal authoring operation.
        # THIS CAPABILITY IS NOT GUARDED. The component implements no confirmation,
        # approval, dry-run or read-only mode for it. The only control is
        # reference-workflow discipline (PHASE_1_EXECUTION_PLAN.md 2), which lives in
        # THIS repository, not in revit-mcp. `confirmed` records that the tool
        # exists and is registered; it authorises no use.
        api_family: Autodesk Revit API
        api_maturity: not-applicable
        mcp_component: revit-mcp
        mcp_implementation_status: confirmed
        data_readiness: not-assessed

  - id: cde_information_management
    platform: Autodesk Forma
    automation_policy: stable_api_preferred
    capabilities:
      - id: document_management
        primary_system: Forma Data Management
        # api_version is deliberately OMITTED: no route/API-contract version is
        # established in this repository, and it must not be inferred from the
        # documentation-set version or from current MCP route segments. The
        # lifecycle remains to-be-verified, so no version binding is required.
        api_family: APS Data Management API
        api_maturity: to-be-verified
        mcp_component: aps-forma-mcp
        mcp_implementation_status: confirmed
        data_readiness: ready

  - id: model_coordination
    platform: Autodesk Forma
    automation_policy: use_native_coordination_engine
    capabilities:
      - id: model_coordination
        primary_system: Model Coordination
        # Five read-only model-set/version tools are implemented and live-verified
        # (model-set discovery and detail, snapshot version history, latest/specific
        # coordination snapshot with its participating document versions).
        # Data readiness is satisfied: the dedicated Harrismith training coordination
        # data exists, and MODEL_SET_1 with its coordination snapshots was read
        # successfully. The earlier no_harrismith_model_sets blocker is closed.
        # Phase 3 is complete at outcome shared_model_context_proven.
        # Clash-level reads are NOT implemented: clash results, identifiers, groups,
        # membership and status are unavailable, so direct clash-to-issue provenance
        # and geometric resolution remain unproven. The native Autodesk clash engine
        # is never re-implemented here.
        # api_version is deliberately OMITTED: no route/API-contract version is
        # established here and the lifecycle remains to-be-verified.
        api_family: Model Coordination API
        api_maturity: to-be-verified
        mcp_component: aps-forma-mcp
        mcp_implementation_status: confirmed
        data_readiness: ready

  - id: reviews_and_issues
    platform: Autodesk Forma
    automation_policy: stable_api_preferred
    # STAGE SCOPE. Confirmed READ scope only: Issues reads, seven Reviews reads, and
    # the issue Relationships read, all implemented and live-verified. This stage's
    # read capability is no longer a gap.
    # This status covers reads only. No review, issue, or relationship write is
    # implemented; write workflows remain deferred. The project's sole guarded
    # write tool is unrelated (Forma Site Design, concept_design stage).
    # No direct clash-to-issue relationship was returned, and the Relationships
    # API returned no document record for ISSUE_1; an empty result proves only
    # that no matching record was returned.
    # RFIs, Assets, Submittals, Sheets and Meetings are NOT implemented here.
    # Reviews and Relationships API-family names remain unasserted until verified
    # from an official Autodesk/APS source (ADR-0003: a product-module name is
    # not automatically an API family name). Because those families are unasserted,
    # Reviews and Relationships are NOT separate capability records here; their
    # adoption as governed capabilities is a later increment.
    capabilities:
      - id: issues
        primary_system: Forma Data Management
        # api_version is deliberately OMITTED: no route/API-contract version is
        # established here and the lifecycle remains to-be-verified.
        api_family: APS Issues API
        api_maturity: to-be-verified
        mcp_component: aps-forma-mcp
        mcp_implementation_status: confirmed
        data_readiness: ready

  - id: construction_information
    platform: Autodesk Forma
    automation_policy: focused_reference_examples
    # STAGE SCOPE. Phase 4A now spans Forma Data Management and Forma Build (ADR-0004).
    # PHASE 4A IS NOT COMPLETE. Three capabilities are governed here: Transmittals
    # (first capability — implemented and live-verified; confirmed / ready), RFIs
    # (second governed capability — implemented and live-verified; confirmed /
    # ready) and Submittals (third governed capability — first read-only slice
    # adopted by ADR-0014, implemented and live-verified; confirmed / ready).
    # Sheets is a later candidate; Meetings is deferred (public API
    # not verified). Their API families are deliberately not listed in this task.
    capabilities:
      - id: transmittals
        primary_system: Forma Data Management
        # SELECTED FIRST READ-ONLY SLICE: Autodesk Forma Transmittals v1, adopted by
        # ADR-0004 and owned by the APS/Forma MCP. Scope is fixed at the five
        # documented GET operations: list transmittals; get one transmittal; list
        # recipients; list folders; list included document versions. No write
        # operation is in scope.
        # IMPLEMENTED and LIVE-VERIFIED 2026-07-27: the five read-only Transmittals MCP
        # operations exist in the APS/Forma MCP (see COMPONENT_BOUNDARIES.md 3.3), so
        # mcp_implementation_status is `confirmed` — the vocabulary's value for a tool
        # implemented and verified in component source (COMPONENT_BOUNDARIES.md 2).
        # Gates 2 (authentication scopes), 5 (privacy/sanitisation), 6 (component
        # boundary/roadmap) and 8 (activation, permission, training data) are CLOSED for
        # the Transmittals first slice.
        # SANITISATION: governed by ADR-0005 and the Transmittals public-evidence
        # profile in docs/guides/SANITISATION_CONVENTION.md. Approved aliases reuse
        # PROJECT_n, USER_n, VERSION_n and FOLDER_n, and add TRANSMITTAL_n,
        # RECIPIENT_n, EXTERNAL_MEMBER_n, COMPANY_n and ROLE_n. Behavioural
        # timestamps (receivedAt/viewedAt/downloadedAt) reduce to booleans or counts.
        # GATE 8: closed for the Transmittals first slice on 2026-07-27 under the
        # operative section-14 criteria of PHASE_4_CAPABILITY_GAP.md (see 16.4).
        # The API family name is asserted because it is verified from official
        # Autodesk/APS documentation; api_version v1 is the route/API-contract
        # version established in the published Phase 4 evidence, and is required
        # here because api_maturity: ga is a concrete lifecycle assertion.
        api_family: Autodesk Forma Transmittals API
        api_version: v1
        api_maturity: ga
        mcp_component: aps-forma-mcp
        mcp_implementation_status: confirmed
        # SCOPE OF data_readiness BELOW: readiness was established in the APPROVED
        # TRAINING PROJECT for the Transmittals first slice — NOT in the Harrismith
        # example project, which is not asserted to hold a Transmittals fixture.
        # data_readiness_reason names that scope, per the header definition.
        data_readiness: ready
        data_readiness_reason: transmittals-first-slice-ready-in-approved-training-project

      - id: rfis
        primary_system: Forma Build
        # ADOPTED as the second governed Phase 4A capability, and now IMPLEMENTED,
        # PUBLISHED and LIVE-VERIFIED (2026-07-28).
        # API IDENTITY: asserted because it is verified from official Autodesk/APS
        # documentation (see PHASE_4_CAPABILITY_GAP.md 4 and 5) — Autodesk Forma
        # Build RFI API, contract/request-route version v3 under
        # /construction/rfis/v3/projects/:projectId, general availability announced
        # 2025-07-23. api_version is REQUIRED here because api_maturity: ga is a
        # concrete lifecycle assertion (ADR-0009).
        # IMPLEMENTATION: the governed first read-only slice exists in the APS/Forma
        # MCP at published revision 5dca2297e610d5125ea123cd4203de63e96e943b — three
        # read-only tools, contract-tested offline and live-verified through a
        # freshly launched MCP server over the MCP protocol surface. Shared
        # authentication and HTTP infrastructure still does not count as RFI
        # implementation; the three RFI tools do.
        # GATES / VERIFICATION: Gates 5, 6 and 8 are closed for this first slice
        # (PHASE_4_CAPABILITY_GAP.md 16.5, 16.6 and 16.7). RFI writes remain
        # unsupported and unauthorised.
        # ADOPTED FIRST READ-ONLY SLICE — IMPLEMENTED AND LIVE-VERIFIED:
        # 1. GET users/me; 2. POST search:rfis (approved as read-semantic at
        # endpoint level by ADR-0007); 3. GET rfis/:rfiId. Comments, attachments,
        # responses and all writes are excluded from that initial slice.
        api_family: Autodesk Forma Build RFI API
        api_version: v3
        api_maturity: ga
        mcp_component: aps-forma-mcp
        mcp_implementation_status: confirmed
        # SCOPE OF data_readiness BELOW: readiness was established in the APPROVED
        # TRAINING PROJECT for the RFI first read-only slice, against ONE controlled
        # synthetic Draft, through the published MCP contract — NOT in the Harrismith
        # example project, which is not asserted to hold an RFI fixture. It asserts
        # nothing about other Autodesk projects, other RFI workflow types, any write
        # capability, or production readiness. data_readiness_reason names that
        # scope, per the header definition.
        data_readiness: ready
        data_readiness_reason: rfi-first-slice-ready-in-approved-training-project

      - id: submittals
        primary_system: Forma Build
        # ADOPTED as the third governed Phase 4A capability by ADR-0014
        # (2026-07-29), and now IMPLEMENTED, PUBLISHED and LIVE-VERIFIED
        # (2026-07-29). The three governed read-only tools exist in the APS/Forma
        # MCP at published revision f763d190871743e4c638902ddd6fdadf2d740e88 and
        # were exercised through a freshly launched MCP server over the MCP
        # protocol surface against the controlled synthetic fixture in the
        # approved training project. Shared authentication and HTTP
        # infrastructure still does not count as Submittals implementation; the
        # three Submittals tools do.
        # API IDENTITY: asserted because it is verified from official Autodesk/APS
        # documentation (see PHASE_4_CAPABILITY_GAP.md 4 and 6) — Autodesk Forma
        # Build Submittals API, contract/request-route version v2 under
        # /construction/submittals/v2/projects/:projectId, read phase generally
        # available 2024-02-22. api_version is REQUIRED here because
        # api_maturity: ga is a concrete lifecycle assertion (ADR-0009).
        # ADOPTED FIRST READ-ONLY SLICE — IMPLEMENTED AND LIVE-VERIFIED:
        # 1. GET users/me; 2. GET items; 3. GET items/:itemId. All three are GET,
        # so no POST-as-read classification is involved. Caller projections are
        # 3 / 8 / 17 fields (COMPONENT_BOUNDARIES.md 6.3). Packages, spec sections
        # as independent operations, item types, responses, review steps,
        # attachments, comments, templates, settings/mappings and ALL WRITES are
        # excluded from that initial slice, and Submittals writes remain
        # unsupported and unauthorised.
        # GATES / VERIFICATION: Gate 2 is sufficiently verified (16.8), Gate 5 is
        # passed (16.9), Gate 6 is passed (16.10) and GATE 8 IS CLOSED for this
        # first slice (16.11). Live verification used one fresh MCP process and
        # exactly three Autodesk-facing GET requests with zero writes; the
        # controlled synthetic fixture is unchanged.
        # SCOPE: the proven first-slice requirement is data:read alone. The normal
        # server grant holds a broader four-scope configuration for other
        # capabilities; that does not widen the Submittals requirement.
        # SANITISATION: public evidence is governed by ADR-0013 and the Submittals
        # public-evidence profile in docs/guides/SANITISATION_CONVENTION.md, which
        # approves SUBMITTAL_n and reuses PROJECT_n. That profile governs PUBLIC
        # EVIDENCE; ADR-0014 governs authenticated CALLER OUTPUT, and the two
        # boundaries deliberately differ.
        api_family: Autodesk Forma Build Submittals API
        api_version: v2
        api_maturity: ga
        mcp_component: aps-forma-mcp
        mcp_implementation_status: confirmed
        # SCOPE OF data_readiness BELOW: readiness was established in the APPROVED
        # TRAINING PROJECT for the Submittals first read-only slice, against ONE
        # controlled synthetic fixture, through the published MCP contract — NOT in
        # the Harrismith example project, which is not asserted to hold a Submittal
        # fixture. It asserts nothing about other Autodesk projects, other
        # Submittal workflow states, other caller roles, any write capability, or
        # production readiness. data_readiness_reason names that scope, per the
        # header definition.
        data_readiness: ready
        data_readiness_reason: submittals-first-slice-ready-in-approved-training-project

  - id: asset_handover
    platform: Autodesk Forma
    automation_policy: focused_reference_example
    capabilities:
      - id: assets
        primary_system: Forma Build
        # No Assets MCP tool exists yet (planned). api_family is deliberately
        # OMITTED — the API-family name is left unasserted until verified from an
        # official/component source (ADR-0003); omission means UNASSERTED, not that
        # no API exists. api_version is likewise OMITTED: the lifecycle remains
        # to-be-verified, so no version binding is required. This is a GOVERNED
        # PLANNED capability, which is why it is a capability record rather than
        # `capabilities: []` (ADR-0009).
        api_maturity: to-be-verified
        mcp_component: aps-forma-mcp
        mcp_implementation_status: planned
        data_readiness: not-assessed
